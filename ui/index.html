<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBTrans v1.1 - NBT蓝图转换器</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔄 NBTrans v1.1</h1>
            <p class="subtitle">Minecraft Create Mod 蓝图转换器</p>
            <p class="version-info">支持: 1.20.1 → 1.21.1 | 剪贴板 | 嵌套过滤器</p>
        </header>

        <main>
            <section class="upload-section">
                <div id="fileBox" class="file-box">
                    <input type="file" id="fileInput" multiple accept=".nbt">
                    <div class="file-label">
                        <span>📁 拖拽或点击选择 .nbt 文件</span>
                    </div>
                </div>
                <div id="fileList" class="file-list">未选择文件</div>
            </section>

            <section class="action-section">
                <button id="processBtn" disabled>🔄 开始批量转换</button>
            </section>

            <section class="progress-section">
                <div id="progressBar" class="progress-bar">
                    <div id="progress" class="progress"></div>
                </div>
                <div class="status"></div>
            </section>

            <section id="errorBox" class="error-box"></section>

            <section id="resultSection" class="result-section">
                <h2>✅ 转换结果</h2>
                <div id="resultInfo"></div>
                <button id="downloadAllBtn">📦 下载全部</button>
            </section>
        </main>

        <footer>
            <p>NBTrans v1.1 - 完整NBT解析重建 | 支持剪贴板和嵌套过滤器迁移</p>
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="../utils/logger.js"></script>
    <script src="../utils/gzip.js"></script>
    <script src="../core/nbt-parser.js"></script>
    <script src="../migrators/full-migrator.js"></script>
    <script src="app.js"></script>
</body>
</html>
